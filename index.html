<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern World History Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #E24B4A;
    --red-dark: #A32D2D;
    --red-light: #FCEBEB;
    --blue: #185FA5;
    --blue-light: #E6F1FB;
    --blue-dark: #0C447C;
    --gold: #BA7517;
    --gold-light: #FAEEDA;
    --green: #3B6D11;
    --green-light: #EAF3DE;
    --purple: #3C3489;
    --purple-light: #EEEDFE;
    --bg: #FAFAF8;
    --bg-surface: #FFFFFF;
    --bg-muted: #F4F2EB;
    --text: #1a1a18;
    --text-secondary: #5F5E5A;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.2);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --bg-surface: #232320;
      --bg-muted: #2a2a27;
      --text: #F4F2EB;
      --text-secondary: #9a9890;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.2);
      --red-light: #3a1515;
      --blue-light: #0d2440;
      --gold-light: #2a1e06;
      --green-light: #162508;
      --purple-light: #1a1838;
    }
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  .page-wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }

  /* ── Header ── */
  .site-header {
    border-bottom: 1px solid var(--border);
    padding: 3rem 0 2rem;
    margin-bottom: 2.5rem;
    position: relative;
  }

  .site-header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--red) 0%, var(--blue) 40%, var(--gold) 70%, #1a1a18 100%);
  }

  .header-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--red);
    font-weight: 500;
    margin-bottom: 0.75rem;
  }

  .site-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.25rem);
    font-weight: 700;
    line-height: 1.1;
    color: var(--text);
  }

  .site-header h1 em {
    font-style: italic;
    color: var(--red);
  }

  .header-meta {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    margin-top: 1rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
  }

  .header-meta span::before { content: '▸ '; color: var(--red); }

  /* ── Unit nav ── */
  .unit-nav {
    display: flex;
    gap: 0.25rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
  }

  .unit-tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 0.625rem 1rem;
    border: none;
    background: none;
    color: var(--text-secondary);
    cursor: pointer;
    position: relative;
    transition: color 0.15s;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }

  .unit-tab:hover { color: var(--text); }
  .unit-tab.active {
    color: var(--red);
    border-bottom-color: var(--red);
    font-weight: 500;
  }

  /* ── Feature tabs (Terms / Timeline / Quiz) ── */
  .nav-tabs {
    display: flex;
    gap: 0.25rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
  }

  .nav-tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 0.625rem 1rem;
    border: none;
    background: none;
    color: var(--text-secondary);
    cursor: pointer;
    transition: color 0.15s;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }

  .nav-tab:hover { color: var(--text); }
  .nav-tab.active {
    color: var(--red);
    border-bottom-color: var(--red);
    font-weight: 500;
  }

  /* ── Sections ── */
  .tab-section { display: none; }
  .tab-section.active { display: block; }

  .section-block { margin-bottom: 2.5rem; }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-secondary);
    font-weight: 500;
    padding-bottom: 0.625rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1rem;
  }

  /* ── Term cards ── */
  .term-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 0.625rem;
  }

  .term-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.875rem 1rem;
    background: var(--bg-surface);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.15s, background 0.15s;
  }

  .term-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent-color, var(--red));
  }

  .term-card:hover { border-color: var(--border-strong); background: var(--bg-muted); }
  .term-card.open { background: var(--bg-muted); border-color: var(--border-strong); }

  .term-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .term-name {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    flex: 1;
  }

  .term-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .badge-policy   { background: var(--red-light);    color: var(--red-dark); }
  .badge-person   { background: var(--blue-light);   color: var(--blue-dark); }
  .badge-concept  { background: var(--gold-light);   color: #633806; }
  .badge-event    { background: var(--green-light);  color: var(--green); }
  .badge-place    { background: #F1EFE8;             color: #444441; }
  .badge-tactic   { background: var(--purple-light); color: var(--purple); }
  .badge-battle   { background: var(--red-light);    color: var(--red-dark); }
  .badge-treaty   { background: var(--gold-light);   color: #633806; }
  .badge-ideology { background: var(--purple-light); color: var(--purple); }

  .toggle {
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1;
    flex-shrink: 0;
    transition: transform 0.2s;
    margin-top: 1px;
  }
  .term-card.open .toggle { transform: rotate(45deg); }

  .term-def {
    display: none;
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.75;
    color: var(--text-secondary);
  }
  .term-card.open .term-def { display: block; }

  /* ── Timeline ── */
  .timeline { position: relative; padding-left: 2.25rem; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 7px; top: 8px; bottom: 8px;
    width: 1px;
    background: var(--border-strong);
  }

  .tl-item { position: relative; margin-bottom: 1.5rem; }

  .tl-dot {
    position: absolute;
    left: -2rem;
    top: 4px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--red);
    outline: 2px solid var(--bg);
    border: 1.5px solid var(--red);
  }
  .tl-dot.blue  { background: var(--blue);   border-color: var(--blue); }
  .tl-dot.gold  { background: var(--gold);   border-color: var(--gold); }
  .tl-dot.green { background: var(--green);  border-color: var(--green); }
  .tl-dot.purple{ background: var(--purple); border-color: var(--purple); }

  .tl-year {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    color: var(--red);
    margin-bottom: 2px;
  }
  .tl-year.blue   { color: var(--blue); }
  .tl-year.gold   { color: var(--gold); }
  .tl-year.green  { color: var(--green); }
  .tl-year.purple { color: var(--purple); }

  .tl-title { font-size: 14px; font-weight: 500; color: var(--text); }
  .tl-note  { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; margin-top: 3px; }

  .tl-legend {
    display: flex; gap: 1rem; flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }
  .tl-legend-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-family: 'IBM Plex Mono', monospace;
    color: var(--text-secondary);
  }
  .tl-legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ── Quiz ── */
  .quiz-wrap {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    background: var(--bg-surface);
  }

  .quiz-progress {
    display: flex;
    gap: 4px;
    margin-bottom: 1.25rem;
  }
  .quiz-pip {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: var(--border-strong);
    transition: background 0.3s;
  }
  .quiz-pip.done   { background: var(--green); }
  .quiz-pip.active { background: var(--red); }

  .quiz-q {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.55;
    margin-bottom: 1.25rem;
    min-height: 48px;
  }

  .quiz-opts { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }

  .quiz-opt {
    font-size: 13px;
    padding: 0.625rem 1rem;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: background 0.12s, border-color 0.12s;
    line-height: 1.4;
  }
  .quiz-opt:hover:not([disabled]) { background: var(--bg-muted); border-color: var(--border-strong); }
  .quiz-opt.correct { background: var(--green-light); border-color: var(--green); color: var(--green); font-weight: 500; }
  .quiz-opt.wrong   { background: var(--red-light);   border-color: var(--red);   color: var(--red-dark); }
  .quiz-opt[disabled] { cursor: default; }

  .quiz-feedback {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-secondary);
    min-height: 16px;
    margin-bottom: 1rem;
  }

  .quiz-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .quiz-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 0.5rem 1rem;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .quiz-btn:hover { background: var(--bg-muted); color: var(--text); }

  .quiz-score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-secondary);
  }

  .quiz-result {
    text-align: center;
    padding: 1.5rem 0 0.5rem;
  }
  .quiz-result .big {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .quiz-result .big em { color: var(--red); font-style: italic; }
  .quiz-result p {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0.5rem 0 1rem;
  }

  /* ── Divider ── */
  .divider {
    display: flex; align-items: center; gap: 1rem;
    margin: 2.5rem 0;
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-sym {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--text-secondary);
  }

  /* ── Footer ── */
  .site-footer {
    border-top: 1px solid var(--border);
    padding-top: 1.5rem;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
  }

  /* ── Search ── */
  .search-wrap { margin-bottom: 1.25rem; position: relative; }
  .search-input {
    width: 100%;
    padding: 0.625rem 1rem 0.625rem 2.25rem;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    background: var(--bg-surface);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--red); }
  .search-icon {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    font-size: 14px;
    pointer-events: none;
  }
  .no-results {
    font-size: 13px;
    color: var(--text-secondary);
    font-style: italic;
    padding: 1rem 0;
    display: none;
  }
</style>
</head>
<body>
<div class="page-wrap">

  <header class="site-header">
    <div class="header-eyebrow">Study Guide</div>
    <h1>Modern <em>World History</em><br>Key Terms</h1>
    <div class="header-meta">
      <span>5 units</span>
      <span>Interactive flashcards</span>
      <span>Practice quiz</span>
      <span>Key timeline</span>
    </div>
  </header>

  <!-- Unit selector -->
  <nav class="unit-nav" role="tablist" aria-label="Select unit">
    <button class="unit-tab active" data-unit="wwi"      role="tab">WWI</button>
    <button class="unit-tab"        data-unit="interwar" role="tab">Interwar &amp; Fascism</button>
    <button class="unit-tab"        data-unit="wwii"     role="tab">WWII</button>
    <button class="unit-tab"        data-unit="comm"     role="tab">Communism</button>
    <button class="unit-tab"        data-unit="cold"     role="tab">Cold War</button>
  </nav>

  <!-- Feature tabs -->
  <nav class="nav-tabs" role="tablist" aria-label="View mode">
    <button class="nav-tab active" data-tab="terms"    role="tab">All Terms</button>
    <button class="nav-tab"        data-tab="timeline" role="tab">Timeline</button>
    <button class="nav-tab"        data-tab="quiz"     role="tab">Quiz</button>
  </nav>

  <!-- ══ TAB: TERMS ══ -->
  <section class="tab-section active" id="tab-terms">
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input class="search-input" type="search" id="term-search" placeholder="Search terms…" aria-label="Search terms">
    </div>
    <div class="no-results" id="no-results">No terms match your search.</div>
    <div id="terms-container"></div>
  </section>

  <!-- ══ TAB: TIMELINE ══ -->
  <section class="tab-section" id="tab-timeline">
    <div class="tl-legend">
      <div class="tl-legend-item"><div class="tl-legend-dot" style="background:var(--red)"></div>War / Conflict</div>
      <div class="tl-legend-item"><div class="tl-legend-dot" style="background:var(--blue)"></div>Western / Allied</div>
      <div class="tl-legend-item"><div class="tl-legend-dot" style="background:var(--gold)"></div>Turning Point</div>
      <div class="tl-legend-item"><div class="tl-legend-dot" style="background:var(--green)"></div>Treaty / Peace</div>
      <div class="tl-legend-item"><div class="tl-legend-dot" style="background:var(--purple)"></div>Revolution / Rise</div>
    </div>
    <div class="timeline" id="timeline"></div>
  </section>

  <!-- ══ TAB: QUIZ ══ -->
  <section class="tab-section" id="tab-quiz">
    <div class="quiz-wrap">
      <div class="quiz-progress" id="quiz-progress"></div>
      <div class="quiz-q"    id="quiz-q"></div>
      <div class="quiz-opts" id="quiz-opts"></div>
      <div class="quiz-feedback" id="quiz-feedback"></div>
      <div class="quiz-footer">
        <button class="quiz-btn" id="quiz-next">Next →</button>
        <div class="quiz-score" id="quiz-score"></div>
      </div>
    </div>
  </section>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-sym">★ ★ ★</div>
    <div class="divider-line"></div>
  </div>

  <footer class="site-footer">
    Modern World History Study Guide &middot; click cards to reveal definitions
  </footer>

</div>

<script>
/* ══════════════════════════════════════
   UNIT DATA
══════════════════════════════════════ */
const UNITS = {

  wwi: {
    label: "World War I",
    sections: [
      {
        title: "Causes & Context",
        terms: [
          { name:"MAINE", badge:"concept", def:"The acronym for the five main causes of World War I: Militarism (nations building massive armies and navies), Alliances (the web of defense agreements that pulled nations into war), Imperialism (competition for global colonies), Nationalism (intense loyalty to one's nation or ethnic group), and Entangling Alliances (binding treaties that made a local conflict explode into a world war)." },
          { name:"Militarism", badge:"concept", def:"The policy of maintaining strong military forces and glorifying military power. In pre-WWI Europe, major powers — especially Germany and Britain — engaged in an arms race, building massive armies and navies that made war more likely and more destructive." },
          { name:"Alliances", badge:"policy", def:"Europe was divided into two main alliance blocs: the Triple Alliance (Germany, Austria-Hungary, Italy) and the Triple Entente (France, Russia, Britain). These interlocking agreements meant a local dispute could rapidly escalate into a continental — then world — war." },
          { name:"Imperialism", badge:"concept", def:"European powers competed fiercely for colonies and global influence. This rivalry created tensions and grievances that contributed to the outbreak of war, particularly among the Great Powers seeking resources and prestige." },
          { name:"Nationalism", badge:"concept", def:"Strong devotion to one's nation or ethnic group. In the Balkans, Slavic nationalism challenged Austro-Hungarian rule and contributed directly to the assassination of Archduke Franz Ferdinand. Nationalism both caused the war and sustained soldiers' willingness to fight." },
          { name:"Assassination of Archduke Franz Ferdinand", badge:"event", def:"On June 28, 1914, Austro-Hungarian heir Archduke Franz Ferdinand was shot in Sarajevo, Bosnia, by Gavrilo Princip, a Bosnian Serb nationalist. This triggered the alliance chain reaction that launched World War I within six weeks." },
          { name:"Central Powers", badge:"concept", def:"The alliance fighting against the Entente/Allies in WWI, led by Germany and Austria-Hungary, joined by the Ottoman Empire and Bulgaria. They fought on multiple fronts until Germany's collapse in November 1918." },
          { name:"Allies", badge:"concept", def:"The coalition opposing the Central Powers, originally France, Russia, and Britain (the Triple Entente), later joined by Italy (1915), the USA (1917), and others. Their combined resources ultimately overwhelmed Germany and its partners." },
          { name:"Industrial Revolution", badge:"concept", def:"The preceding century of industrialization gave WWI nations the capacity to produce weapons, ammunition, and military equipment at unprecedented scale, making the war longer and deadlier than any previous conflict." },
        ]
      },
      {
        title: "Warfare & Technology",
        terms: [
          { name:"Trench Warfare", badge:"tactic", def:"The defining feature of the Western Front. Both sides dug hundreds of miles of parallel trenches, creating a stalemate where neither could advance without catastrophic casualties. Soldiers lived in mud and filth, enduring artillery barrages and poison gas attacks." },
          { name:"Total War", badge:"concept", def:"A conflict in which entire nations — not just armies — are mobilized for war. Governments controlled economies, rationed food, censored press, and directed civilian labor. WWI was the first true total war, blurring the line between soldier and civilian." },
          { name:"Submarine Warfare", badge:"tactic", def:"Germany's U-boats (submarines) attempted to blockade Britain by sinking any ship in British waters, including neutral and civilian vessels. The sinking of the Lusitania (1915) killed 1,198 people and inflamed American opinion against Germany." },
          { name:"Poison Gas", badge:"tactic", def:"First used by Germany in 1915 at Ypres, chemical weapons (chlorine, mustard gas) caused horrific casualties and became a symbol of WWI's industrial brutality. Both sides used gas, causing blindness, lung damage, and death." },
          { name:"New Technology (Tanks, Submarines, Poison Gas)", badge:"tactic", def:"WWI introduced or massively expanded deadly technologies: tanks broke through trench lines, submarines attacked shipping, poison gas terrorized troops, aircraft conducted reconnaissance and combat, and artillery barrages killed millions. Technology made the war uniquely catastrophic." },
          { name:"Eastern & Western Fronts", badge:"place", def:"WWI was fought on two main fronts: the Western Front (France/Belgium) — a static trench stalemate — and the more fluid Eastern Front (Russia vs. Germany/Austria-Hungary). Russia's collapse in 1917 freed German troops to make a final failed push in the West." },
          { name:"Battle of Gallipoli", badge:"battle", def:"(1915–16) A failed Allied campaign to capture the Ottoman-controlled Dardanelles strait and open a supply route to Russia. Planned by Winston Churchill, it resulted in over 250,000 Allied casualties and became a defining trauma for Australia and New Zealand." },
          { name:"Winston Churchill", badge:"person", def:"British statesman who served as First Lord of the Admiralty during WWI, masterminding — and taking blame for — the disastrous Gallipoli campaign. He learned from WWI's failures and would lead Britain through WWII as Prime Minister." },
        ]
      },
      {
        title: "Key Turning Points",
        terms: [
          { name:"Zimmerman Telegram", badge:"event", def:"A secret 1917 diplomatic cable from Germany to Mexico, proposing a military alliance in exchange for Germany's help recapturing Texas, New Mexico, and Arizona from the USA. When Britain intercepted and published it, it outraged Americans and accelerated US entry into the war." },
          { name:"Propaganda", badge:"tactic", def:"Governments on all sides used posters, films, and newspapers to rally support, demonize the enemy, and suppress dissent. Britain used propaganda to sway neutral nations (including the USA); Germany countered with its own messaging. It was the first war fought as much with words as weapons." },
          { name:"Russian Revolution — February 1917", badge:"event", def:"Bread riots and military mutinies toppled Tsar Nicholas II, ending centuries of Romanov rule. A Provisional Government took power and initially continued the war — a fateful decision that left the door open for the Bolsheviks." },
          { name:"Russian Revolution — October 1917 (Bolsheviks / Lenin)", badge:"event", def:"Vladimir Lenin's Bolshevik Party seized power in a coup, promising 'Peace, Land, Bread.' They immediately negotiated an armistice with Germany, removing Russia from WWI and allowing Germany to shift massive forces westward for a final offensive." },
          { name:"Treaty of Brest-Litovsk", badge:"treaty", def:"March 1918 peace treaty between Soviet Russia and the Central Powers, ending Russian participation in WWI. Russia surrendered vast territories (Poland, Finland, Baltic states, Ukraine). It showed the Bolsheviks' desperate desire for peace at almost any price." },
        ]
      },
      {
        title: "Peace & Aftermath",
        terms: [
          { name:"End of War — 11/11/1918", badge:"event", def:"At 11 a.m. on November 11, 1918, an armistice took effect, ending WWI. Germany, facing internal revolution and military collapse, agreed to Allied ceasefire terms. The date is still commemorated as Remembrance Day / Veterans Day." },
          { name:"Armistice", badge:"event", def:"A formal agreement to stop fighting — not technically a surrender but a ceasefire. The Armistice of November 11, 1918 ended WWI combat. Germany agreed to withdraw its forces and disarm, but kept hope of a fair peace — hopes soon dashed by the Treaty of Versailles." },
          { name:"Paris Peace Conference", badge:"event", def:"The 1919 conference at Versailles where Allied powers negotiated the post-WWI settlement. Dominated by the 'Big Four' (USA, Britain, France, Italy), it produced five treaties, most notably the Treaty of Versailles with Germany. Defeated powers had no voice." },
          { name:"Wilson's 14 Points", badge:"policy", def:"US President Woodrow Wilson's idealistic blueprint for post-war peace, presented to Congress in January 1918. Key points included freedom of the seas, national self-determination, open diplomacy, and a League of Nations. Many were ignored or watered down at Paris." },
          { name:"Treaty of Versailles", badge:"treaty", def:"The 1919 peace treaty ending WWI with Germany. It forced Germany to accept sole blame (the 'War Guilt Clause'), pay massive reparations, surrender territory, and drastically limit its military. Most historians agree its harshness helped fuel the resentments that led to WWII." },
          { name:"League of Nations", badge:"policy", def:"Woodrow Wilson's proposed international organization to maintain world peace through collective security and arbitration. It was created in 1920 but fatally weakened when the US Senate refused to join. Without America, it lacked the power to prevent WWII." },
          { name:"Armenian Genocide", badge:"event", def:"The systematic mass murder and deportation of the Armenian Christian minority by the Ottoman Empire (1915–1923), killing an estimated 600,000 to 1.5 million people. It is widely recognized as the 20th century's first genocide, though Turkey still disputes the term." },
        ]
      }

  interwar: {
    label: "Interwar Years, Fascism & the Holocaust",
    sections: [
      {
        title: "Post-WWI Settlement",
        terms: [
          { name:"League of Nations (LON)", badge:"policy", def:"An intergovernmental organization founded in 1920 after WWI to maintain world peace. Fatally weakened by the US refusal to join and by its inability to enforce decisions militarily. It failed to stop Japanese aggression in Manchuria (1931) or Italian invasion of Ethiopia (1935)." },
          { name:"Big 3", badge:"person", def:"The three dominant Allied leaders at the 1919 Paris Peace Conference: US President Woodrow Wilson (idealism, 14 Points), British PM David Lloyd George (public pressure for harsh terms), and French PM Georges Clemenceau (revenge and security above all). Italy's Orlando was often sidelined despite Allied status." },
          { name:"Paris Peace Conference", badge:"event", def:"The 1919 negotiations at Versailles that produced the post-WWI peace settlement. Defeated nations — Germany, Austria-Hungary, Ottoman Empire — had no voice. The resulting treaties redrew the map of Europe and the Middle East, often along ethnic lines but also creating new grievances." },
          { name:"Treaty of Versailles", badge:"treaty", def:"The 1919 peace treaty with Germany. It imposed the 'War Guilt Clause' (Article 231) blaming Germany for the war, mandated reparations of 132 billion gold marks, stripped Germany of 13% of its territory and 10% of its population, and severely limited the German military." },
          { name:"Lost Generation", badge:"concept", def:"The generation of young men killed or psychologically shattered by WWI. The term (associated with writers like Hemingway and Fitzgerald) captures the disillusionment that followed — a sense that old values of duty and honor had led only to industrial slaughter." },
          { name:"Reparations", badge:"policy", def:"Financial penalties imposed on Germany by the Treaty of Versailles to compensate Allied nations for war damages. Set at 132 billion gold marks (equivalent to hundreds of billions today), they caused hyperinflation and economic chaos in 1920s Germany, fueling resentment." },
          { name:"Dawes Plan", badge:"policy", def:"A 1924 US-backed agreement that restructured Germany's reparations payments and provided American loans to stabilize the German economy. It temporarily eased the crisis but tied Germany's recovery to US capital — which evaporated in the 1929 crash." },
          { name:"Great Depression", badge:"event", def:"The global economic catastrophe beginning with the 1929 Wall Street Crash. Mass unemployment (25%+ in the US and Germany), bank failures, and collapsing trade devastated living standards worldwide. Economic despair made populations receptive to extremist political movements, including fascism." },
        ]
      },
      {
        title: "Rise of Fascism",
        terms: [
          { name:"Core Beliefs of Fascism", badge:"ideology", def:"Fascism combines extreme nationalism, authoritarianism, and totalitarianism. Key tenets include: the state above all individual rights, a single all-powerful leader, suppression of opposition, glorification of violence and war, racial hierarchy and Social Darwinism (survival of the 'fittest' race), and expansionist foreign policy." },
          { name:"Political Spectrum (Left/Right)", badge:"concept", def:"A framework for categorizing political ideologies: the left favors equality, collective ownership, and social change; the right favors tradition, hierarchy, and private property. Fascism sits at the extreme right — using populist language but serving nationalist and authoritarian ends." },
          { name:"Hitler", badge:"person", def:"Adolf Hitler (1889–1945), Austrian-born leader of the Nazi Party and dictator of Germany (Führer) from 1933. His ideology of racial hierarchy, antisemitism, and German expansion drove WWII and the Holocaust. He died by suicide in Berlin as Soviet forces closed in on April 30, 1945." },
          { name:"Mussolini (Benito Mussolini)", badge:"person", def:"Italian fascist dictator (Il Duce) who founded the fascist movement and ruled Italy (1922–1943). His March on Rome in 1922 brought him to power with King Victor Emmanuel III's approval. An ally of Hitler, he was captured by Italian partisans and executed in 1945." },
          { name:"Il Duce", badge:"concept", def:"Italian for 'The Leader' — Mussolini's official title as fascist dictator of Italy. The use of such titles (alongside Hitler's 'Führer' and Stalin's 'Vozhd') reflected the cult of personality central to totalitarian regimes, presenting the leader as an infallible embodiment of the nation." },
          { name:"Nazis", badge:"ideology", def:"The National Socialist German Workers' Party (NSDAP), founded 1920. Under Hitler, they combined extreme nationalism, antisemitism, anticommunism, and social Darwinism into a totalitarian ideology. The Nazis won power legally in 1933 then dismantled democracy to establish a one-party dictatorship." },
          { name:"Blackshirts", badge:"tactic", def:"The paramilitary squadrons (Squadrismo) of Mussolini's Italian Fascist movement, named for their uniform. They used violence and intimidation against socialists, communists, and political opponents in the early 1920s, helping Mussolini seize power. They became the organizational backbone of Italian fascism." },
          { name:"Brown Shirts", badge:"tactic", def:"The Sturmabteilung (SA) — the Nazi Party's original paramilitary force, named for their uniforms. They terrorized political opponents in the streets during the Weimar Republic era, helping Hitler rise to power. Hitler had SA leader Ernst Röhm killed in the Night of the Long Knives (1934)." },
          { name:"Living Space (Lebensraum / Spazio Vitale)", badge:"ideology", def:"A core Nazi concept (also echoed in Italian fascism) holding that Germany needed additional territory — primarily in Eastern Europe — for its growing 'Aryan' population. This provided ideological justification for aggression against Poland, the USSR, and other nations." },
          { name:"Scapegoat", badge:"concept", def:"Blaming a vulnerable group for a society's problems. Hitler scapegoated Jewish people for Germany's WWI defeat (the 'stab-in-the-back' myth), economic problems, and cultural decline. Scapegoating is a central propaganda technique that diverts anger from real causes onto targeted minorities." },
          { name:"Fear Mongering", badge:"tactic", def:"Deliberately exaggerating threats to manipulate public opinion and justify extreme measures. Fascists used fear of communism, economic collapse, and national humiliation to win support and suppress opposition. Fear created demand for a 'strong leader' who promised to restore order." },
          { name:"Propaganda", badge:"tactic", def:"Information — true, distorted, or false — used to promote a political agenda. Nazi propaganda minister Joseph Goebbels controlled all German media, using rallies, films, radio, and posters to build Hitler's cult of personality, spread antisemitism, and prepare Germany for war." },
        ]
      },
      {
        title: "Fascist Expansion & Appeasement",
        terms: [
          { name:"March on Rome", badge:"event", def:"October 1922: Mussolini's Blackshirts marched on Rome, threatening to seize power by force. Fearing civil war, King Victor Emmanuel III appointed Mussolini as Prime Minister rather than call the army's bluff. Mussolini then consolidated power and declared a fascist dictatorship." },
          { name:"Reichstag Fire", badge:"event", def:"February 27, 1933: the German parliament building burned down. Hitler blamed communists (a Dutch anarchist was convicted) and used the crisis to push through the Reichstag Fire Decree, suspending civil liberties. It enabled the rapid dismantling of Weimar democracy." },
          { name:"Enabling Act", badge:"policy", def:"March 1933: the German parliament (intimidated by SA troops) granted Hitler the power to enact laws without parliamentary approval for four years. It effectively made Hitler a legal dictator and marks the formal end of Weimar democracy." },
          { name:"Vittoria Mutilata (Mutilated Victory)", badge:"concept", def:"Italian nationalists' term for their sense of betrayal after WWI — Italy had joined the Allies expecting large territorial gains but received far less than promised at Paris. This grievance was exploited by Mussolini to build support for fascism." },
          { name:"Remilitarization of Rhineland", badge:"event", def:"March 1936: Hitler sent troops into the demilitarized Rhineland, violating the Treaty of Versailles and Locarno Treaties. France and Britain protested but did nothing. The success emboldened Hitler and showed Western powers would not enforce the peace settlement." },
          { name:"Annexation of Austria (Anschluss) — 1938", badge:"event", def:"In March 1938, German troops entered Austria and incorporated it into the Third Reich. The union (Anschluss) was prohibited by the Treaty of Versailles but Britain and France again did not intervene. Most Austrians welcomed it with cheering crowds." },
          { name:"Munich Conference / Munich Agreement", badge:"event", def:"September 1938: Britain, France, Italy, and Germany met in Munich. Britain's Neville Chamberlain and France's Daladier agreed to give Hitler the Sudetenland (Czech territory) in exchange for a promise of no further demands. Czechoslovakia was not invited. It became the defining example of failed appeasement." },
          { name:"Appeasement", badge:"policy", def:"The British and French strategy of making concessions to Hitler's demands to avoid war. Driven by fear of another devastating conflict and sympathy for some German grievances. Munich (1938) is its symbol. Churchill condemned it: 'An appeaser is one who feeds a crocodile, hoping it will eat him last.'" },
          { name:"Invasion of Manchuria", badge:"event", def:"September 1931: Japan's Kwantung Army seized Manchuria (northeastern China), creating the puppet state Manchukuo. China appealed to the League of Nations, which condemned Japan but took no action. Japan simply withdrew from the League — exposing its impotence." },
          { name:"Sino-Japanese War", badge:"event", def:"(1937–1945) Japan's full-scale invasion of China, beginning with the Marco Polo Bridge Incident (July 1937). Japanese forces committed atrocities including the Rape of Nanjing. China fought a brutal war of survival until Japan's defeat in 1945 ended the conflict." },
          { name:"German Invasion of Poland — Sept 1, 1939", badge:"event", def:"Germany launched a Blitzkrieg ('lightning war') invasion of Poland on September 1, 1939. Britain and France, bound by treaty to defend Poland, declared war on Germany two days later. This is the formal start of World War II in Europe." },
        ]
      },
      {
        title: "Indoctrination",
        terms: [
          { name:"Hitler Youth", badge:"tactic", def:"The Nazi youth organization (Hitler-Jugend) for boys aged 14–18, mandatory from 1936. Members were indoctrinated with Nazi ideology, physical fitness, and military training. By 1939 it had over 8 million members. Girls were channeled into the parallel League of German Girls." },
          { name:"League of German Girls", badge:"tactic", def:"(Bund Deutscher Mädel / BDM) The female counterpart to the Hitler Youth for girls aged 14–18. Girls were trained in Nazi ideology, domestic skills, and physical fitness — preparing them to be 'ideal' German wives and mothers who would raise future soldiers for the Reich." },
          { name:"Italianization", badge:"policy", def:"Mussolini's policy of forcibly assimilating ethnic minorities in Italian-controlled territories — suppressing their languages, names, and cultures and replacing them with Italian ones. Applied especially harshly to Slovenes, Croats, and Germans in regions Italy gained after WWI." },
        ]
      },
      {
        title: "The Holocaust",
        terms: [
          { name:"Antisemitism", badge:"ideology", def:"Prejudice, discrimination, and hatred directed at Jewish people. Central to Nazi ideology, antisemitism portrayed Jews as a racial enemy responsible for Germany's problems. It escalated from discrimination (Nuremberg Laws, 1935) to systematic mass murder (the Final Solution, 1941–45)." },
          { name:"Aryans", badge:"ideology", def:"The Nazi pseudo-scientific racial category for the 'master race' — blonde, blue-eyed northern Europeans. In Nazi ideology, Aryans were superior to all other races and destined to rule Europe. This racial hierarchy underpinned the persecution and murder of Jews, Roma, disabled people, and others." },
          { name:"Nuremberg Laws", badge:"policy", def:"September 1935 laws that stripped German Jews of citizenship, prohibited marriage or sexual relations between Jews and non-Jews, and defined who counted as Jewish. They formalized antisemitic discrimination in law and began the systematic exclusion of Jews from German society." },
          { name:"Kristallnacht", badge:"event", def:"'Night of Broken Glass' — November 9–10, 1938. Nazi paramilitaries and mobs attacked Jewish businesses, synagogues, and homes across Germany and Austria, killing around 100 Jews, injuring thousands, and arresting 30,000. It marked a sharp escalation from discrimination to open violence." },
          { name:"Dehumanization", badge:"tactic", def:"The process of denying the humanity of a targeted group — portraying them as vermin, disease, or subhuman. Nazi propaganda systematically dehumanized Jewish people, making mass murder psychologically easier for perpetrators and reducing resistance from bystanders." },
          { name:"Ghettos", badge:"place", def:"Sealed-off urban areas where Nazis forced Jewish populations to live in overcrowded, deliberately lethal conditions. The Warsaw Ghetto held 400,000 people at its peak. Ghettos were used to concentrate Jewish populations before deportation to extermination camps." },
          { name:"T4 Program", badge:"event", def:"The Nazi program (Aktion T4) that secretly murdered people with physical and mental disabilities — an estimated 200,000–300,000 people between 1939–1945. It served as a 'trial run' for the mass murder techniques (gas chambers, cremation) later used in the Holocaust." },
          { name:"Final Solution", badge:"event", def:"(Endlösung) The Nazi regime's plan for the systematic murder of all Jews in Europe. Formalized at the Wannsee Conference (January 1942), it resulted in the industrialized killing of approximately 6 million Jews in death camps such as Auschwitz, Treblinka, and Sobibor." },
          { name:"Concentration / Extermination Camps", badge:"place", def:"The Nazi camp system ranged from concentration camps (forced labor, starvation, brutality) to extermination camps (Vernichtungslager) built solely for mass murder. The six death camps — all in occupied Poland — used gas chambers to kill primarily Jews. Over 6 million Jews and millions of others perished." },
          { name:"Auschwitz", badge:"place", def:"The largest Nazi concentration and extermination camp complex, in occupied Poland. An estimated 1.1 million people were killed here, approximately 90% of them Jewish. Auschwitz has become the defining symbol of the Holocaust's industrial scale of murder." },
          { name:"Gestapo", badge:"tactic", def:"The Geheime Staatspolizei (Secret State Police) — the Nazi regime's feared political police. They monitored, arrested, tortured, and killed political opponents, Jews, and others. They operated with minimal legal oversight, embodying the lawless terror of the Nazi state." },
          { name:"Nuremberg Trials", badge:"event", def:"(1945–46) International military tribunals held after WWII to prosecute Nazi leaders for war crimes, crimes against humanity, and crimes against peace. Twenty-four major Nazi leaders were tried; twelve were sentenced to death. The trials established international legal precedents for prosecuting genocide." },
          { name:"Elie Wiesel", badge:"person", def:"Romanian-born Jewish writer and Holocaust survivor (1928–2016). His memoir Night describes his experiences in Auschwitz and Buchenwald. A Nobel Peace Prize laureate (1986), he dedicated his life to Holocaust remembrance and the fight against indifference to human suffering." },
        ]
      }

  wwii: {
    label: "World War II",
    sections: [
      {
        title: "Key Figures",
        terms: [
          { name:"Hitler", badge:"person", def:"Adolf Hitler — Nazi dictator of Germany (1933–1945). His ideology of Aryan racial supremacy, antisemitism, and German Lebensraum ('living space') drove both WWII and the Holocaust. He initiated the war with the invasion of Poland (1939) and directed German military strategy until his suicide on April 30, 1945." },
          { name:"Mussolini", badge:"person", def:"Benito Mussolini — Italian fascist dictator and Hitler's main European ally. Italy joined WWII on Germany's side in June 1940. After Allied forces invaded Italy (1943), Mussolini was overthrown, rescued by Germans, and eventually captured and executed by Italian partisans in April 1945." },
          { name:"Roosevelt", badge:"person", def:"Franklin D. Roosevelt — US President (1933–1945) who led America through the Depression and WWII. He crafted the Lend-Lease Act to supply the Allies before Pearl Harbor, then directed the massive US war effort. He died in office on April 12, 1945, weeks before Germany's surrender." },
          { name:"Stalin", badge:"person", def:"Josef Stalin — Soviet dictator who signed the Non-Aggression Pact with Hitler (1939) then was blindsided by Operation Barbarossa (1941). The USSR suffered catastrophic losses — approximately 27 million dead — but ultimately defeated Germany on the Eastern Front, the war's decisive theater." },
        ]
      },
      {
        title: "Alliances & Ideology",
        terms: [
          { name:"Axis Powers", badge:"concept", def:"The alliance of Germany, Italy, and Japan — formalized by the Tripartite Pact (September 1940). They sought to dominate Europe, the Mediterranean, and Asia/Pacific respectively. Minor Axis members included Hungary, Romania, and Bulgaria." },
          { name:"Allied Powers", badge:"concept", def:"The coalition opposing the Axis, including Britain, France (Free French after 1940), the USSR (from June 1941), the USA (from December 1941), China, and dozens of other nations. Allied cooperation — especially the 'Big Three' (USA, UK, USSR) — was essential to victory." },
          { name:"GEACPS (Greater East Asian Co-Prosperity Sphere)", badge:"ideology", def:"Japan's propaganda framework for its imperial expansion across Asia. It promised Asian nations liberation from Western colonialism under Japanese leadership in a 'co-prosperity' sphere. In reality, it masked brutal military occupation, forced labor, and resource extraction." },
          { name:"German-Soviet Pact (Non-Aggression Pact)", badge:"policy", def:"The Molotov-Ribbentrop Pact, signed August 23, 1939. Germany and the USSR agreed not to attack each other and secretly divided Eastern Europe into spheres of influence. It freed Germany to invade Poland without Soviet opposition. Hitler violated it with Operation Barbarossa in June 1941." },
        ]
      },
      {
        title: "Road to War",
        terms: [
          { name:"Beer Hall Putsch", badge:"event", def:"November 1923: Hitler's failed attempt to seize power in Munich by launching a coup from a beer hall. The putsch was crushed; Hitler was imprisoned for 9 months (where he wrote Mein Kampf). Far from ending his career, it made him a national figure and taught him to pursue power through elections." },
          { name:"Reichstag Fire / Enabling Laws", badge:"event", def:"The February 1933 Reichstag fire gave Hitler the pretext to suspend civil liberties (Reichstag Fire Decree). The subsequent Enabling Act (March 1933) gave him dictatorial legislative powers. Together they mark the death of German democracy and the birth of the Nazi dictatorship." },
          { name:"Invasion of Poland — Sept 1, 1939", badge:"event", def:"Germany's Blitzkrieg invasion launched WWII. The Wehrmacht used fast-moving armor, motorized infantry, and air power to overwhelm Polish defenses in weeks. The USSR invaded from the east on September 17, crushing Poland between them under the terms of their secret pact." },
          { name:"Manchuria", badge:"place", def:"Japan's 1931 invasion of Manchuria (northeastern China) and creation of the puppet state of Manchukuo marked the beginning of Japanese imperial expansion in Asia. It exposed the League of Nations' weakness and foreshadowed the broader Pacific conflict." },
          { name:"Rape of Nanjing", badge:"event", def:"December 1937–January 1938: Japanese forces captured China's then-capital Nanjing and engaged in six weeks of systematic atrocities — mass murder of POWs and civilians (estimates range from 40,000–300,000 killed) and widespread rape. It remains a deeply divisive historical memory between China and Japan." },
        ]
      },
      {
        title: "Major Battles & Operations",
        terms: [
          { name:"Pearl Harbor", badge:"battle", def:"December 7, 1941: Japan launched a surprise naval air attack on the US Pacific Fleet at Pearl Harbor, Hawaii, sinking or damaging 19 ships and killing 2,403 Americans. The next day, the USA declared war on Japan; Germany and Italy declared war on the USA days later, making it a truly world war." },
          { name:"The Blitz", badge:"event", def:"September 1940–May 1941: Germany's sustained bombing campaign against British cities, primarily London. Over 43,000 British civilians were killed. Rather than breaking British morale as intended, the Blitz united the population behind Churchill's defiant resistance." },
          { name:"Operation Barbarossa", badge:"battle", def:"June 22, 1941: Germany launched history's largest military operation — 3.8 million troops invaded the USSR on a 2,900-km front. Initial advances were staggering, but the invasion ultimately failed to knock out the USSR before winter, committing Germany to a catastrophic two-front war." },
          { name:"Battle of Stalingrad", badge:"battle", def:"August 1942–February 1943: The bloodiest battle in history (est. 2 million casualties). Germany's Sixth Army became trapped in the ruins of Stalingrad; its surrender on February 2, 1943 marked the decisive turning point on the Eastern Front and in the entire war." },
          { name:"Battle of El Alamein", badge:"battle", def:"October–November 1942: British General Montgomery's forces defeated Rommel's Afrika Korps in Egypt. It ended the Axis threat to the Suez Canal and Middle Eastern oil, and was Churchill's turning point: 'Before Alamein we never had a victory. After Alamein we never had a defeat.'" },
          { name:"Battle of Midway", badge:"battle", def:"June 4–7, 1942: A decisive US naval victory in the Pacific. US codebreakers had identified the target in advance; carrier-based aircraft sank four Japanese fleet carriers, destroying Japan's offensive striking power. It is considered the turning point of the Pacific War." },
          { name:"Island Hopping", badge:"tactic", def:"The US Pacific strategy of selectively capturing strategically important islands while bypassing heavily fortified Japanese positions. By 'hopping' closer to Japan — through Guadalcanal, Tarawa, Iwo Jima, Okinawa — US forces cut Japanese supply lines and established air bases for bombing the Japanese home islands." },
          { name:"D-Day / Operation Overlord", badge:"battle", def:"June 6, 1944: The largest seaborne invasion in history. Over 156,000 Allied troops landed on five Normandy beaches, opening the long-awaited Western Front. Though casualties were severe (especially at Omaha Beach), the operation established the Allied foothold that ultimately liberated Western Europe." },
        ]
      },
      {

function buildCard(term) {
  const card = document.createElement('div');
  card.className = 'term-card';
  card.dataset.name = term.name.toLowerCase();
  card.dataset.def  = (term.def || '').toLowerCase();

  const accentMap = {
    policy:'var(--red)', person:'var(--blue)', concept:'var(--gold)',
    event:'var(--green)', place:'#888', tactic:'var(--purple)',
    battle:'var(--red)', treaty:'var(--gold)', ideology:'var(--purple)'
  };
  card.style.setProperty('--accent-color', accentMap[term.badge] || 'var(--red)');

  card.innerHTML = `
    <div class="term-head">
      <div class="term-name">${term.name}</div>
      <span class="term-badge badge-${term.badge}">${term.badge}</span>
      <span class="toggle">+</span>
    </div>
    <div class="term-def">${term.def || ''}</div>
  `;
  card.addEventListener('click', () => card.classList.toggle('open'));
  return card;
}

function renderTerms(unitKey) {
  const container = document.getElementById('terms-container');
  container.innerHTML = '';
  const unit = UNITS[unitKey];
  unit.sections.forEach(section => {
    const block = document.createElement('div');
    block.className = 'section-block';
    block.innerHTML = `<div class="section-label">${section.title}</div>`;
    const grid = document.createElement('div');
    grid.className = 'term-grid';
    section.terms.forEach(t => grid.appendChild(buildCard(t)));
    block.appendChild(grid);
    container.appendChild(block);
  });
  // reset search
  const si = document.getElementById('term-search');
  if (si) si.value = '';
  document.getElementById('no-results').style.display = 'none';
  document.querySelectorAll('.term-card').forEach(c => c.style.display = '');
  document.querySelectorAll('.section-block').forEach(b => b.style.display = '');
}

/* ── Search ── */
document.getElementById('term-search').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll('.term-card').forEach(card => {
    const match = !q || card.dataset.name.includes(q) || card.dataset.def.includes(q);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.querySelectorAll('.section-block').forEach(block => {
    const anyVisible = [...block.querySelectorAll('.term-card')].some(c => c.style.display !== 'none');
    block.style.display = anyVisible ? '' : (q ? 'none' : '');
  });
  document.getElementById('no-results').style.display = (q && visible === 0) ? 'block' : 'none';
});

/* ══════════════════════════════════════
   TIMELINE
══════════════════════════════════════ */
function renderTimeline(unitKey) {
  const container = document.getElementById('timeline');
  container.innerHTML = '';
  UNITS[unitKey].timeline.forEach(item => {
    const el = document.createElement('div');
    el.className = 'tl-item';
    const dotClass = item.color === 'red' ? '' : item.color;
    const yearClass = item.color === 'red' ? '' : item.color;
    el.innerHTML = `
      <div class="tl-dot ${dotClass}"></div>
      <div class="tl-year ${yearClass}">${item.year}</div>
      <div class="tl-title">${item.title}</div>
      <div class="tl-note">${item.note}</div>
    `;
    container.appendChild(el);
  });
}

/* ══════════════════════════════════════
   QUIZ
══════════════════════════════════════ */
function initQuiz(unitKey) {
  const questions = [...UNITS[unitKey].quiz].sort(() => Math.random() - 0.5);
  quizState = { index: 0, score: 0, answered: false, questions };

  const wrap = document.querySelector('.quiz-wrap');
  wrap.innerHTML = `
    <div class="quiz-progress" id="quiz-progress"></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="quiz-opts" id="quiz-opts"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <div class="quiz-footer">
      <button class="quiz-btn" id="quiz-next">Next →</button>
      <div class="quiz-score" id="quiz-score"></div>
    </div>
  `;
  document.getElementById('quiz-next').addEventListener('click', advanceQuiz);
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const { index, score, questions } = quizState;
  const total = questions.length;
  const q = questions[index];

  const prog = document.getElementById('quiz-progress');
  prog.innerHTML = questions.map((_, i) => {
    const cls = i < index ? 'done' : i === index ? 'active' : '';
    return `<div class="quiz-pip ${cls}"></div>`;
  }).join('');

  document.getElementById('quiz-q').textContent = q.q;
  document.getElementById('quiz-feedback').textContent = '';
  document.getElementById('quiz-score').textContent = `${score} / ${total}`;

  const opts = document.getElementById('quiz-opts');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt';
    btn.textContent = opt;
    btn.addEventListener('click', () => {
      if (quizState.answered) return;
      quizState.answered = true;
      [...opts.querySelectorAll('.quiz-opt')].forEach(b => b.disabled = true);
      if (i === q.answer) {
        btn.classList.add('correct');
        quizState.score++;
        document.getElementById('quiz-feedback').textContent = '✓ Correct!';
      } else {
        btn.classList.add('wrong');
        opts.querySelectorAll('.quiz-opt')[q.answer].classList.add('correct');
        document.getElementById('quiz-feedback').textContent = '✗ Not quite — see the highlighted answer.';
      }
      document.getElementById('quiz-score').textContent = `${quizState.score} / ${total}`;
    });
    opts.appendChild(btn);
  });
  quizState.answered = false;
}

function advanceQuiz() {
  quizState.index++;
  if (quizState.index >= quizState.questions.length) {
    showQuizResult();
  } else {
    renderQuizQuestion();
  }
}

function showQuizResult() {
  const { score, questions } = quizState;
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  const msg = pct >= 80 ? 'Excellent — you know this material well.' : pct >= 60 ? 'Good effort — review the ones you missed.' : 'Keep studying — you\'ll get there.';
  document.querySelector('.quiz-wrap').innerHTML = `
    <div class="quiz-result">
      <div class="big">${score}<em>/${total}</em></div>
      <p>${msg}</p>
      <button class="quiz-btn" onclick="initQuiz('${currentUnit}')">Try again →</button>
    </div>
  `;
}

/* ══════════════════════════════════════
   UNIT SWITCHING
══════════════════════════════════════ */
function loadUnit(unitKey) {
  currentUnit = unitKey;

  document.querySelectorAll('.unit-tab').forEach(b => b.classList.remove('active'));
  document.querySelector(`.unit-tab[data-unit="${unitKey}"]`).classList.add('active');

  renderTerms(unitKey);
  renderTimeline(unitKey);
  if (currentFeatureTab === 'quiz') {
    initQuiz(unitKey);
  }
}

document.querySelectorAll('.unit-tab').forEach(btn => {
  btn.addEventListener('click', () => loadUnit(btn.dataset.unit));
});

/* ══════════════════════════════════════
   FEATURE TAB SWITCHING
══════════════════════════════════════ */
document.querySelectorAll('.nav-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    currentFeatureTab = btn.dataset.tab;
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');

    if (currentFeatureTab === 'quiz') {
      initQuiz(currentUnit);
    }
  });
});

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
loadUnit('wwi');
</script>
